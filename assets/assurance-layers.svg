<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 790" role="img"><rect width="1580" height="790" rx="18" fill="#070b11"/><defs><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><style>
svg {font-family:Inter,"DejaVu Sans",sans-serif}
.mono,.micro,.laneLabel,.trustLabel,.value {font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}
.nodeRect{fill:#090e15;fill-opacity:.96;stroke-width:1.25}
.nodeTop{fill:#ffffff;fill-opacity:.018}
.micro{font-size:10px;font-weight:700;letter-spacing:.6px}
.title{fill:#eef3f9;font-weight:700}.sub{fill:#95a2b3}
.value{font-weight:800;letter-spacing:-.4px}
.laneLabel{fill:#708197;letter-spacing:1.4px;font-size:12px;font-weight:800}
.trustLabel{font-size:11px;font-weight:800;letter-spacing:.5px}
.flow{fill:none;stroke:#253247;stroke-width:2.6;stroke-linecap:round}
.flow.blue{stroke:#3d8fc6}.flow.gold{stroke:#9d7b2c}.flow.green{stroke:#1d8d67}
.flow.amber{stroke:#b87527}.flow.red{stroke:#8d2e39}.flow.dashed{stroke-dasharray:7 9}
.halo{filter:url(#glow)}.halo2{filter:url(#glow2)}
</style><text x="50" y="132" font-size="43" fill="#f2f5f9" font-weight="700">Test the producer of the evidence.</text><text x="50" y="181" font-size="25" fill="#95a2b3" font-weight="500">Checks, version identity and operational readbacks make claims inspectable.</text><rect x="50" y="231" width="470" height="259" rx="18" fill="#0b1017" stroke="#55b8ff" stroke-width="1.6"/><text x="77" y="274" font-size="16" fill="#55b8ff" font-weight="700">REGRESSION</text><text x="77" y="323" font-size="31" fill="#f2f5f9" font-weight="700">Expected behavior</text><text x="77" y="377" font-size="23" fill="#9caabc" font-weight="500">Defined inputs and outcomes</text><text x="77" y="413" font-size="23" fill="#9caabc" font-weight="500">Replay the recorded case</text><rect x="565" y="231" width="470" height="259" rx="18" fill="#0b1017" stroke="#e2b033" stroke-width="1.6"/><text x="592" y="274" font-size="16" fill="#e2b033" font-weight="700">MUTATION</text><text x="592" y="323" font-size="31" fill="#f2f5f9" font-weight="700">A known defect</text><text x="592" y="377" font-size="23" fill="#9caabc" font-weight="500">Plant a fault deliberately</text><text x="592" y="413" font-size="23" fill="#9caabc" font-weight="500">The relevant check must refuse</text><rect x="1080" y="231" width="470" height="259" rx="18" fill="#0b1017" stroke="#23d18b" stroke-width="1.6"/><text x="1107" y="274" font-size="16" fill="#23d18b" font-weight="700">RELEASE IDENTITY</text><text x="1107" y="323" font-size="31" fill="#f2f5f9" font-weight="700">The intended bytes</text><text x="1107" y="377" font-size="23" fill="#9caabc" font-weight="500">Reviewed → installed → served</text><text x="1107" y="413" font-size="23" fill="#9caabc" font-weight="500">Read back, compare, record</text><rect x="50" y="553" width="1500" height="118" rx="18" fill="#0b1017" stroke="#384557" stroke-width="1.6"/><text x="78" y="600" font-size="23" fill="#eef3f9" font-weight="700">ENGINEERING BEHAVIOR  ≠  OPERATIONAL EVIDENCE  ≠  STRATEGY PERFORMANCE</text><text x="78" y="644" font-size="25" fill="#95a2b3" font-weight="500">Confidence in the machinery does not establish a profitable trading edge.</text></svg>